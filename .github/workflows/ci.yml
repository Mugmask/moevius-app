name: CI

on:
  pull_request:
    branches: [main, develop]
  # También corre al pushear directo a estas ramas, para no enterarnos tarde.
  push:
    branches: [main, develop]

# Si se pushea de nuevo al mismo PR, cancelamos la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El CI sólo lee código: nada de permisos de escritura.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Única fuente de verdad de la versión de Node: .nvmrc
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
